name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; a newer push cancels the in-flight run for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# game-ci/unity-test-runner posts results as a GitHub Check Run; the default
# GITHUB_TOKEN is read-only for `checks` on new repos, so grant it explicitly.
permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: EditMode + PlayMode tests
    runs-on: ubuntu-latest
    steps:
      # The GitHub-hosted runner only has ~14 GB free; the Unity editor Docker
      # image (linux-il2cpp) unpacks to more than that on top of the project.
      # Drop the big preinstalled toolchains we don't use to make room.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # Library/ is gitignored; caching it turns a ~15 min cold import into a
      # ~2 min warm one on later runs. Key changes only when project inputs change.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          # Unity Personal license. Method B: email + password only (GameCI v4 can
          # activate a Personal seat from credentials). If that fails, add
          # UNITY_LICENSE with the contents of a manually-activated .ulf.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          # Explicit - matches ProjectSettings/ProjectVersion.txt; GameCI editor
          # image for this version is confirmed present on Docker Hub.
          unityVersion: 6000.3.22f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: artifacts
          checkName: Unity test results

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
          retention-days: 14
